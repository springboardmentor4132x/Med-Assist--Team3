services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medassist
      POSTGRES_PASSWORD: medassist_dev_password
      POSTGRES_DB: medassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://medassist:medassist_dev_password@postgres:5432/medassist
      JWT_SECRET_KEY: local-docker-dev-jwt-secret-key-change-before-deploy-32bytes
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SEED_DEMO_USERS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

